<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuizFlow</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-br from-purple-200 via-purple-100 to-purple-300 min-h-screen flex items-center justify-center font-sans">

<!-- 🔊 SOUNDS -->
<audio id="soundCorrect" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
<audio id="soundWrong" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

<!-- HOME -->
<div id="home" class="text-center space-y-6">
  <h1 class="text-5xl font-bold text-purple-800">QuizFlow</h1>

  <button onclick="showJoin()" class="bg-white text-purple-700 px-8 py-3 rounded-2xl shadow hover:scale-105 transition">
    Join Game
  </button>

  <button onclick="createGame()" class="bg-purple-500 text-white px-8 py-3 rounded-2xl shadow hover:scale-105 transition">
    Create Game
  </button>
</div>

<!-- JOIN -->
<div id="join" class="hidden bg-white p-8 rounded-3xl shadow-lg text-center space-y-4 w-80 fade-in">
  <h2 class="text-2xl font-bold text-purple-700">Enter Nickname</h2>

  <input id="nickname" type="text" placeholder="Your nickname"
    class="border p-3 rounded-xl w-full text-center"/>

  <button onclick="joinGame()" class="bg-purple-500 text-white px-5 py-2 rounded-xl w-full">
    Join
  </button>

  <button onclick="goHome()" class="text-sm text-purple-500 hover:underline">← Back</button>
</div>

<!-- LOBBY -->
<div id="lobby" class="hidden bg-white p-8 rounded-3xl shadow-lg w-96 text-center space-y-6 fade-in">
  <h2 class="text-2xl font-bold text-purple-700">Lobby</h2>

  <div>PIN: <span id="pin" class="font-bold text-purple-600"></span></div>

  <ul id="players" class="space-y-2"></ul>

  <button onclick="startGame()" class="bg-purple-500 text-white px-5 py-2 rounded-xl w-full">
    Start Game
  </button>
</div>

<!-- QUIZ -->
<div id="quiz" class="hidden w-full max-w-md text-center space-y-6 fade-in">

  <!-- TIMER -->
  <div class="w-full px-4">
    <div class="h-2 bg-white/50 rounded-full overflow-hidden">
      <div id="timerBar" class="h-full bg-purple-600 w-full transition-all"></div>
    </div>
  </div>

  <h2 id="question" class="text-xl font-bold text-purple-800"></h2>

  <div class="grid grid-cols-2 gap-4">
    <div onclick="answer(0)" class="bg-purple-300 h-24 rounded-2xl flex items-center justify-center cursor-pointer"></div>
    <div onclick="answer(1)" class="bg-purple-400 text-white h-24 rounded-2xl flex items-center justify-center cursor-pointer"></div>
    <div onclick="answer(2)" class="bg-purple-200 h-24 rounded-2xl flex items-center justify-center cursor-pointer"></div>
    <div onclick="answer(3)" class="bg-purple-500 text-white h-24 rounded-2xl flex items-center justify-center cursor-pointer"></div>
  </div>

</div>

<!-- LEADERBOARD -->
<div id="leaderboard" class="hidden w-full max-w-md text-center space-y-6 fade-in">

  <h2 class="text-3xl font-bold text-purple-800">🏆 Results</h2>

  <div id="top3" class="flex justify-center gap-3 items-end"></div>

  <div id="leaderboardList" class="space-y-2"></div>

  <button onclick="goHome()" 
    class="bg-purple-500 text-white px-5 py-2 rounded-xl w-full hover:bg-purple-600 transition">
    Play Again
  </button>
</div>
<script src="script.js"></script>
</body>
</html>
