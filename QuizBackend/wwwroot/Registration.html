<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizFlow | Register</title>
    <link rel="icon" href="kotEmine.png" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/auth.js" defer></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex items-center justify-center font-sans relative overflow-x-hidden p-4 bg-[#0a0a0a]">

<div class="blob"></div>
<div class="blob2"></div>

<div class="glass p-6 md:p-8 rounded-[30px] shadow-2xl w-full max-w-[400px] space-y-4 md:space-y-6 fade-in text-center z-10 relative">

    <div class="space-y-1">
        <h2 class="text-2xl md:text-3xl font-black text-neon tracking-tight uppercase italic">Create Account</h2>
        <p class="text-neon opacity-60 text-xs">Join us to host your own quizzes</p>
    </div>
    
    <div class="space-y-3 md:space-y-4 text-left">
        <div>
            <label class="text-[9px] font-bold text-neon opacity-60 ml-2 uppercase tracking-widest">Nickname</label>
            <input id="regName" type="text" placeholder="GamerName" 
                   class="input w-full mt-1 px-4 py-3 text-sm">
        </div>

        <div>
            <label class="text-[9px] font-bold text-neon opacity-60 ml-2 uppercase tracking-widest">Email Address</label>
            <input id="regEmail" type="email" placeholder="email@example.com" 
                   class="input w-full mt-1 px-4 py-3 text-sm">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
                <label class="text-[9px] font-bold text-neon opacity-60 ml-2 uppercase tracking-widest">Password</label>
                <input id="regPass" type="password" placeholder="••••" 
                       class="input w-full mt-1 px-4 py-3 text-sm text-center">
            </div>
            <div>
                <label class="text-[9px] font-bold text-neon opacity-60 ml-2 uppercase tracking-widest">Confirm</label>
                <input id="regPassConfirm" type="password" placeholder="••••" 
                       class="input w-full mt-1 px-4 py-3 text-sm text-center">
            </div>
        </div>
    </div>

    <button onclick="register()" 
            class="btn-neon w-full py-4 rounded-2xl font-black shadow-lg transform transition active:scale-95 uppercase tracking-wider text-sm">
        Create & Continue
    </button>

    <div class="text-xs pt-2">
        <p class="text-neon opacity-70">
            Already have an account? 
            <a href="Authorization.html" class="text-neon font-black hover:underline decoration-2 underline-offset-4">
                Sign In
            </a>
        </p>
    </div>
</div>

</body>
</html>
