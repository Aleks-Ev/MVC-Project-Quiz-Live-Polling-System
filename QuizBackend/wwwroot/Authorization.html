<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizFlow | Sign In</title>
    <link rel="icon" href="kotEmine.png" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/auth.js" defer></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex items-center justify-center font-sans relative overflow-x-hidden p-4 bg-[#0a0a0a]">

<div class="blob"></div>
<div class="blob2"></div>

<div class="glass p-6 md:p-8 rounded-[30px] md:rounded-[40px] shadow-2xl w-full max-w-[400px] space-y-6 md:space-y-8 fade-in text-center z-10 relative">

    <div class="space-y-2">
        <h2 class="text-3xl md:text-4xl font-black text-neon tracking-tight uppercase italic">Welcome Back</h2>
        <p class="text-neon opacity-60 text-xs md:text-sm">Sign in to manage your quizzes</p>
    </div>
    
    <div class="space-y-4 md:space-y-5">
        <div class="text-left">
            <label class="text-[10px] md:text-xs text-neon ml-2 opacity-70 uppercase font-bold tracking-widest">Email Address</label>
            <input id="authEmail" type="email" placeholder="name@example.com" 
                   class="input w-full mt-1 px-5 py-3 md:py-4 text-sm md:text-base">
        </div>
        
        <div class="text-left">
            <label class="text-[10px] md:text-xs text-neon ml-2 opacity-70 uppercase font-bold tracking-widest">Password</label>
            <input id="authPassword" type="password" placeholder="••••••••" 
                   class="input w-full mt-1 px-5 py-3 md:py-4 text-sm md:text-base">
        </div>
    </div>

    <button onclick="login()" 
            class="btn-neon w-full py-4 rounded-2xl font-black shadow-lg transform transition active:scale-95 uppercase tracking-wider">
        Sign In
    </button>

    <div class="text-xs md:text-sm pt-4 border-t border-white/10 space-y-4">
        <p class="text-neon opacity-70">
            Don't have an account? 
            <a href="Registration.html" class="text-neon font-black hover:underline decoration-2 underline-offset-4">
                Create Account
            </a>
        </p>

        <p>
            <a href="start.html" class="text-neon opacity-40 hover:opacity-100 transition text-[10px] md:text-xs uppercase tracking-widest font-bold">
                ← Back to Home
            </a>
        </p>
    </div>
</div>

</body>
</html>
