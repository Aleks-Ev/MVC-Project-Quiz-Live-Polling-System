<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizFlow | Home</title>
    <link rel="icon" href="kotEmine.png" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
    
    <script src="js/auth.js" defer></script>
    <script src="js/game.js" defer></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex items-center justify-center font-sans relative overflow-x-hidden p-4">

    <div class="blob"></div>
    <div class="blob2"></div>

    <div class="absolute top-4 md:top-6 right-4 md:right-8 z-20">
        <button id="authBtn" onclick="goHome()" 
            class="glass px-4 md:px-6 py-2 rounded-full text-neon text-sm md:text-base font-bold border border-white/10 hover:bg-white/10 transition-all">
            Sign In
        </button>
    </div>

    <div id="home" class="text-center space-y-8 md:space-y-10 fade-in z-10 w-full max-w-lg">
        <div class="space-y-2">
            <h1 class="text-5xl md:text-7xl font-black text-neon tracking-tighter italic uppercase">QuizFlow</h1>
            <p class="text-neon opacity-50 tracking-[0.2em] md:tracking-[0.3em] font-light text-xs md:text-base uppercase">Play and Learn</p>
        </div>

        <div class="flex flex-col gap-4 items-center">
            <button onclick="showJoin()" 
                class="btn-neon w-full md:w-72 py-5 rounded-3xl font-black text-xl shadow-[0_0_30px_rgba(199,240,0,0.3)] transform transition active:scale-95">
                JOIN GAME
            </button>

            <button onclick="location.href='Registration.html'" 
                class="w-full md:w-72 bg-white/5 hover:bg-white/10 text-white border border-white/10 py-4 rounded-3xl font-bold transition-all text-sm md:text-base">
                Create Account
            </button>
        </div>
    </div>

    <div id="join" class="hidden glass p-6 md:p-10 rounded-[30px] md:rounded-[40px] shadow-2xl text-center space-y-6 fade-in w-full max-w-[400px] z-10 relative">
        <div class="space-y-1">
            <h2 class="text-2xl md:text-3xl font-black text-neon uppercase italic">Enter Lobby</h2>
            <p class="text-neon text-[10px] md:text-xs opacity-60">Enter the code provided by the host</p>
        </div>

        <div class="space-y-4">
            <div class="text-left">
                <label class="text-[10px] text-neon opacity-50 ml-4 font-bold uppercase">Your Nickname</label>
                <input id="nickname" type="text" placeholder="Gamer123" class="input w-full mt-1 px-5 py-3 md:py-4">
            </div>
            <div class="text-left">
                <label class="text-[10px] text-neon opacity-50 ml-4 font-bold uppercase">Lobby Code</label>
                <input id="pinInput" type="text" placeholder="0000" 
                    class="input w-full mt-1 text-center text-xl md:text-2xl tracking-[0.3em] md:tracking-[0.5em] font-black uppercase py-3 md:py-4">
            </div>
        </div>

        <button onclick="joinGame()" class="btn-neon w-full py-4 rounded-2xl font-black shadow-lg uppercase tracking-wider">
            START PLAYING
        </button>

        <button onclick="location.reload()" class="text-[10px] md:text-xs text-neon opacity-50 hover:opacity-100 transition tracking-widest font-bold">
            ← CANCEL
        </button>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem("userToken");
            const userName = localStorage.getItem("userName");
            const authBtn = document.getElementById("authBtn");
            
            if (token && userName) {
                authBtn.innerText = `Hi, ${userName}`;
            }
        });

        function showJoin() {
            document.getElementById("home").classList.add("hidden");
            document.getElementById("join").classList.remove("hidden");
        }

        async function joinGame() {
            const nick = document.getElementById("nickname").value.trim();
            const pin = document.getElementById("pinInput").value.trim();

            if (!nick || !pin) return alert("Please fill all fields!");

            localStorage.setItem("userName", nick);
            localStorage.setItem("lobbyPin", pin);
            localStorage.setItem("isHost", "false");

            window.location.href = "Lobby.html";
        }

        // Вспомогательная функция для кнопки Sign In
        function goHome() {
            const token = localStorage.getItem("userToken");
            window.location.href = token ? "dashboard.html" : "Registration.html";
        }
    </script>

</body>
</html>
