<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizFlow | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 min-h-screen flex items-center justify-center font-sans">

<div id="home" class="text-center space-y-8 fade-in">
    <h1 class="text-6xl font-black text-purple-700">QuizFlow</h1>

    <div class="flex flex-col gap-4 items-center">
        <button onclick="showJoin()" class="w-64 bg-white text-purple-700 font-bold px-6 py-3 rounded-2xl shadow hover:-translate-y-1">
            Join Game
        </button>

        <button onclick="goToCreate()" class="w-64 bg-purple-600 text-white font-bold px-6 py-3 rounded-2xl shadow hover:bg-purple-700 hover:-translate-y-1">
            Create Game
        </button>
    </div>
</div>

<div id="join" class="hidden bg-white p-8 rounded-2xl shadow text-center space-y-4 fade-in">
    <h2 class="text-xl font-bold">Join Lobby</h2>

    <input id="nickname" placeholder="Nickname" class="border p-3 w-full rounded-xl text-center">
    <input id="pinInput" placeholder="Lobby Code" class="border p-3 w-full rounded-xl text-center">

    <button onclick="joinGame()" class="bg-purple-600 text-white w-full py-2 rounded-xl">
        Enter Lobby
    </button>

    <button onclick="goHome()" class="text-sm text-gray-400">
        ← Back
    </button>
</div>

<script src="script.js"></script>
</body>
</html>
