<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizFlow | My Dashboard</title>
    <link rel="icon" href="kotEmine.png" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
    
    <script src="js/auth.js" defer></script>
    
    <link rel="stylesheet" href="style.css">

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem("userToken");
            console.log("Current Token in Dashboard:", token); // Это покажет, есть ли токен

            if (!token || token === "undefined") {
                console.error("No valid token! Redirecting...");
                // window.location.href = "Authorization.html"; // ВРЕМЕННО закомментируй, чтобы не вылетало
            } else {
                console.log("Token found, loading dashboard...");
                displayUserDashboard();
            }
        });
    </script>
</head>

<body class="min-h-screen font-sans p-6 relative overflow-x-hidden">

<div class="blob"></div>
<div class="blob2"></div>

<nav class="flex justify-between items-center max-w-5xl mx-auto mb-10 z-10 relative glass px-6 py-4 rounded-3xl shadow-xl">

    <div id="userGreeting" class="text-xl font-black text-neon tracking-tight">
        Hi, Loading...
    </div>

    <div class="flex items-center space-x-6">
        <button id="createLobbyBtn"
            onclick="createLobbyFromSelected()" 
            disabled 
            class="btn-neon px-8 py-3 rounded-2xl font-bold opacity-50 cursor-not-allowed transition-all transform active:scale-95 shadow-lg">
            Create Lobby
        </button>

        <button onclick="logout()" 
            class="text-neon opacity-70 hover:opacity-100 font-bold transition-all border-b-2 border-transparent hover:border-neon">
            Sign Out
        </button>
    </div>
</nav>

<main class="max-w-3xl mx-auto space-y-8 z-10 relative fade-in">

    <div class="flex justify-between items-end">
        <div>
            <h2 class="text-4xl font-black text-neon">My Quizzes</h2>
            <p class="text-neon opacity-60 text-sm">Select a quiz to start a game lobby</p>
        </div>
        
        <button onclick="location.href='CreateQuiz.html'" 
            class="bg-white/10 hover:bg-white/20 text-neon px-5 py-2 rounded-xl text-sm font-bold transition-all border border-white/10">
            + New Quiz
        </button>
    </div>
    
    <div id="quizList" class="grid gap-4 min-h-[300px] glass p-6 rounded-3xl shadow-inner overflow-y-auto max-h-[60vh]">
        <div class="flex flex-col items-center justify-center space-y-4 opacity-40 py-10">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-neon"></div>
            <p class="italic">Synchronizing with database...</p>
        </div>
    </div>

</main>

<footer class="mt-20 text-center z-10 relative opacity-30 text-xs text-neon">
    QuizFlow Engine v2.0 | Secured Session
</footer>

</body>
</html>
