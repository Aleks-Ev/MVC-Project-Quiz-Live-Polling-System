<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizFlow | My Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 min-h-screen font-sans p-6">

    <nav class="flex justify-between items-center max-w-5xl mx-auto mb-10">
        <div id="userGreeting" class="text-xl font-bold text-gray-700">Hi, Loading...</div>
        <div class="space-x-4">
            <button id="createLobbyBtn" onclick="createLobbyFromSelected()" disabled 
                class="bg-purple-400 text-white px-6 py-2 rounded-xl font-bold opacity-50 cursor-not-allowed transition shadow-md">
                Create Lobby
            </button>
            <button onclick="logout()" class="text-red-500 hover:text-red-700 font-medium">Exit</button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto space-y-6">
        <h2 class="text-2xl font-black text-gray-800">My Quizzes</h2>
        
        <div id="quizList" class="space-y-3 min-h-[200px]">
            <p class="text-gray-400 italic">You haven't created any quizzes yet...</p>
        </div>

        <button onclick="location.href='CreateQuiz.html'" 
            class="w-full bg-white border-2 border-dashed border-purple-300 text-purple-600 py-6 rounded-3xl font-bold hover:border-purple-500 hover:bg-purple-50 transition">
            + Create New Game
        </button>
    </main>

    <script src="script.js"></script>
    <script>
        // Специальный скрипт только для этой страницы
        window.onload = function() {
            displayUserDashboard();
        };
    </script>
</body>
</html>
