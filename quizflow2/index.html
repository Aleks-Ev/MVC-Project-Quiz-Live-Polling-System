<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizFlow | Challenge Your Mind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 min-h-screen flex items-center justify-center font-sans">

    <audio id="soundCorrect" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
    <audio id="soundWrong" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

    <div id="home" class="text-center space-y-8 fade-in">
        <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 drop-shadow-sm">QuizFlow</h1>
        <div class="flex flex-col gap-4 items-center">
            <button onclick="showJoin()" class="w-64 bg-white text-purple-700 font-bold px-8 py-4 rounded-2xl shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all">Join Game</button>
            <button onclick="createGame()" class="w-64 bg-purple-600 text-white font-bold px-8 py-4 rounded-2xl shadow-lg hover:bg-purple-700 hover:-translate-y-1 transition-all">Create Game</button>
        </div>
    </div>

    <div id="join" class="hidden bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-2xl text-center space-y-6 w-80 fade-in border border-white">
        <h2 class="text-2xl font-bold text-gray-800">Your Nickname</h2>
        <input id="nickname" type="text" placeholder="Enter name..." class="border-2 border-purple-100 p-4 rounded-2xl w-full text-center focus:border-purple-500 outline-none transition-colors"/>
        <button onclick="joinGame()" class="bg-purple-600 text-white font-bold py-3 rounded-2xl w-full shadow-md hover:bg-purple-700">Enter Lobby</button>
        <button onclick="goHome()" class="text-sm text-gray-400 hover:text-purple-500 transition">← Back</button>
    </div>

    <div id="lobby" class="hidden bg-white p-8 rounded-3xl shadow-2xl w-96 text-center space-y-6 fade-in border border-purple-100">
        <div class="space-y-1">
            <h2 class="text-2xl font-bold text-gray-800">Game Lobby</h2>
            <p class="text-gray-400 italic">Waiting for players...</p>
        </div>
        <div class="bg-purple-50 p-4 rounded-2xl">
            <span class="text-gray-500 uppercase text-xs font-bold tracking-widest">Game PIN</span>
            <div id="pin" class="text-4xl font-black text-purple-600 tracking-widest"></div>
        </div>
        <ul id="players" class="space-y-3 text-left"></ul>
        <button onclick="startGame()" class="bg-green-500 text-white font-bold py-4 rounded-2xl w-full shadow-lg hover:bg-green-600 transition-all">Start Battle!</button>
    </div>

    <div id="quiz" class="hidden w-full max-w-2xl px-4 text-center space-y-8 fade-in">
        <div class="w-full bg-white/50 rounded-full h-3 overflow-hidden shadow-inner">
            <div id="timerBar" class="h-full bg-gradient-to-r from-purple-500 to-pink-500 w-full transition-all duration-1000 ease-linear"></div>
        </div>
        <h2 id="question" class="text-3xl font-bold text-gray-800 leading-tight"></h2>
        <div id="optionsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div onclick="answer(0)" class="option-btn bg-white hover:bg-purple-50 h-24 rounded-3xl flex items-center justify-center cursor-pointer shadow-md font-bold text-xl text-purple-800 transition-all border-b-4 border-purple-200 active:border-b-0 active:translate-y-1"></div>
            <div onclick="answer(1)" class="option-btn bg-white hover:bg-purple-50 h-24 rounded-3xl flex items-center justify-center cursor-pointer shadow-md font-bold text-xl text-purple-800 transition-all border-b-4 border-purple-200 active:border-b-0 active:translate-y-1"></div>
            <div onclick="answer(2)" class="option-btn bg-white hover:bg-purple-50 h-24 rounded-3xl flex items-center justify-center cursor-pointer shadow-md font-bold text-xl text-purple-800 transition-all border-b-4 border-purple-200 active:border-b-0 active:translate-y-1"></div>
            <div onclick="answer(3)" class="option-btn bg-white hover:bg-purple-50 h-24 rounded-3xl flex items-center justify-center cursor-pointer shadow-md font-bold text-xl text-purple-800 transition-all border-b-4 border-purple-200 active:border-b-0 active:translate-y-1"></div>
        </div>
    </div>

    <div id="leaderboard" class="hidden w-full max-w-md text-center space-y-8 fade-in">
        <h2 class="text-4xl font-black text-purple-800">🏆 Podium</h2>
        <div id="top3" class="flex justify-center gap-4 items-end min-h-[150px]"></div>
        <div id="leaderboardList" class="bg-white/50 p-4 rounded-3xl space-y-2"></div>
        <button onclick="goHome()" class="bg-purple-600 text-white font-bold py-4 rounded-2xl w-full hover:bg-purple-700 transition shadow-lg">Play Again</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
