<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizFlow | Register</title>
    <link rel="icon" href="kotEmine.png" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/auth.js" defer></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex items-center justify-center font-sans relative overflow-hidden">

<div class="blob"></div>
<div class="blob2"></div>

<div class="glass p-8 rounded-3xl shadow-2xl w-96 space-y-6 fade-in text-center z-10 relative">

    <h2 class="text-3xl font-black text-neon tracking-tight">Create Account</h2>
    <p class="text-neon opacity-60 text-sm">Join us to create and host your own quizzes</p>
    
    <div class="space-y-4 text-left">

        <div>
            <label class="text-[10px] font-bold text-neon opacity-60 ml-2 uppercase tracking-widest">Nickname</label>
            <input id="regName" type="text" placeholder="How should we call you?" 
                   class="input w-full mt-1">
        </div>

        <div>
            <label class="text-[10px] font-bold text-neon opacity-60 ml-2 uppercase tracking-widest">Email Address</label>
            <input id="regEmail" type="email" placeholder="email@example.com" 
                   class="input w-full mt-1">
        </div>

        <div>
            <label class="text-[10px] font-bold text-neon opacity-60 ml-2 uppercase tracking-widest">Password</label>
            <input id="regPass" type="password" placeholder="••••••••" 
                   class="input w-full mt-1">
        </div>

        <div>
            <label class="text-[10px] font-bold text-neon opacity-60 ml-2 uppercase tracking-widest">Confirm Password</label>
            <input id="regPassConfirm" type="password" placeholder="••••••••" 
                   class="input w-full mt-1">
        </div>

    </div>

    <button onclick="register()" 
            class="btn-neon w-full py-4 rounded-2xl font-bold shadow-lg transform transition active:scale-95">
        Create & Continue
    </button>

    <div class="text-sm pt-2">
        <p class="text-neon opacity-70">
            Already have an account? 
            <a href="Authorization.html" class="text-neon font-black hover:underline decoration-2 underline-offset-4">
                Sign In
            </a>
        </p>
    </div>
</div>

</body>
</html>
