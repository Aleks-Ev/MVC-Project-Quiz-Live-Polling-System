<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-br from-gray-200 to-gray-300 min-h-screen flex items-center justify-center">

<div class="bg-white p-10 rounded-3xl shadow-2xl w-96 text-center space-y-6 fade-in">

    <div>
        <h2 class="text-2xl font-bold text-gray-800">Game Lobby</h2>
        <p class="text-gray-400 italic">Waiting for players...</p>
    </div>

    <div class="bg-purple-100 p-6 rounded-2xl">
        <p class="text-xs text-gray-500 uppercase">Game PIN</p>
        <div id="pin" class="text-4xl font-black text-purple-600">----</div>
    </div>

    <ul id="players" class="space-y-2"></ul>

    <button onclick="startGame()" class="bg-green-500 text-white w-full py-4 rounded-2xl text-lg font-bold hover:bg-green-600">
        Start Battle!
    </button>

</div>

<script src="script.js"></script>
</body>
</html>
