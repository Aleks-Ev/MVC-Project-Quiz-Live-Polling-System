<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizFlow | Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-3xl shadow-xl w-96 space-y-6 fade-in text-center">
        <h2 class="text-3xl font-black text-purple-700">Sign In</h2>
        
        <div class="space-y-4">
            <input id="authEmail" type="email" placeholder="Email" class="border p-3 w-full rounded-xl focus:ring-2 focus:ring-purple-400 outline-none">
            <input id="authPassword" type="password" placeholder="Password" class="border p-3 w-full rounded-xl focus:ring-2 focus:ring-purple-400 outline-none">
        </div>

        <button onclick="login()" class="bg-purple-600 text-white w-full py-3 rounded-xl font-bold hover:bg-purple-700 transition">
            Sign In
        </button>

        <div class="text-sm space-y-2">
            <p class="text-gray-500">Don't have an account? 
                <a href="Registration.html" class="text-purple-600 font-bold hover:underline">Register here</a>
            </p>
            <p><a href="#" onclick="alert('Password reset link sent!')" class="text-gray-400 hover:text-purple-500 transition">Forgot password?</a></p>
        </div>

        <button onclick="location.href='start.html'" class="text-xs text-gray-400">← Back to Home</button>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
