<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizFlow | Sign In</title>
    <link rel="icon" href="kotEmine.png" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/auth.js" defer></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex items-center justify-center font-sans relative overflow-hidden">

<div class="blob"></div>
<div class="blob2"></div>

<div class="glass p-8 rounded-3xl shadow-2xl w-96 space-y-6 fade-in text-center z-10 relative">

    <h2 class="text-4xl font-black text-neon tracking-tight">Welcome Back</h2>
    <p class="text-neon opacity-60 text-sm">Sign in to manage your quizzes</p>
    
    <div class="space-y-4">
        <div class="text-left">
            <label class="text-xs text-neon ml-2 opacity-70 uppercase font-bold">Email Address</label>
            <input id="authEmail" type="email" placeholder="name@example.com" 
                   class="input w-full mt-1">
        </div>
        
        <div class="text-left">
            <label class="text-xs text-neon ml-2 opacity-70 uppercase font-bold">Password</label>
            <input id="authPassword" type="password" placeholder="••••••••" 
                   class="input w-full mt-1">
        </div>
    </div>

    <button onclick="login()" 
            class="btn-neon w-full py-4 rounded-2xl font-bold shadow-lg transform transition active:scale-95">
        Sign In
    </button>

    <div class="text-sm pt-4 border-t border-white/10 space-y-3">
        <p class="text-neon opacity-70">
            Don't have an account? 
            <a href="Registration.html" class="text-neon font-black hover:underline decoration-2 underline-offset-4">
                Create Account
            </a>
        </p>

        <p>
            <a href="start.html" class="text-neon opacity-50 hover:opacity-100 transition text-xs">
                ← Back to Home
            </a>
        </p>
    </div>
</div>

</body>
</html>
