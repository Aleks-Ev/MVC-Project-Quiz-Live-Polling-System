<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

<div class="bg-white p-8 rounded-2xl shadow w-96 space-y-4 fade-in">

    <h2 class="text-2xl font-bold text-center">Create Quiz</h2>

    <input id="questionInput" placeholder="Enter question" class="border p-3 w-full rounded-xl">

    <input class="answer border p-3 w-full rounded-xl" placeholder="Answer 1">
    <input class="answer border p-3 w-full rounded-xl" placeholder="Answer 2">
    <input class="answer border p-3 w-full rounded-xl" placeholder="Answer 3">
    <input class="answer border p-3 w-full rounded-xl" placeholder="Answer 4">

    <input id="correctIndex" type="number" min="0" max="3" placeholder="Correct answer (0-3)" class="border p-3 w-full rounded-xl">

    <button onclick="addQuestion()" class="bg-blue-500 text-white w-full py-2 rounded-xl hover:bg-blue-600">
        Add Question
    </button>

    <button onclick="finishQuiz()" class="bg-green-500 text-white w-full py-2 rounded-xl hover:bg-green-600">
        Create Lobby
    </button>

    <button onclick="goBack()" class="text-sm text-gray-400 w-full">
        ← Back
    </button>

</div>

<script src="script.js"></script>
</body>
</html>
