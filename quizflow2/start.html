<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizFlow | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 min-h-screen flex items-center justify-center font-sans relative">

    <div class="absolute top-6 right-8">
        <button onclick="location.href='Authorization.html'" 
            class="text-purple-700 font-bold hover:text-purple-900 transition flex items-center gap-2">
            <span>Sign In</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
        </button>
    </div>

    <div id="home" class="text-center space-y-8 fade-in">
        <h1 class="text-6xl font-black text-purple-700 drop-shadow-sm">QuizFlow</h1>

        <div class="flex flex-col gap-4 items-center">
            <button onclick="showJoin()" 
                class="w-64 bg-white text-purple-700 font-bold px-6 py-4 rounded-2xl shadow-lg hover:-translate-y-1 transition-all active:scale-95">
                Join Game
            </button>

            <button onclick="location.href='CreateQuiz.html?quick=true'" 
                class="w-64 bg-purple-600 text-white font-bold px-6 py-4 rounded-2xl shadow-lg hover:bg-purple-700 hover:-translate-y-1 transition-all active:scale-95">
                Create Quick Game
            </button>
        </div>
    </div>

    <div id="join" class="hidden bg-white p-8 rounded-3xl shadow-2xl text-center space-y-5 fade-in w-80 border border-purple-100">
        <h2 class="text-2xl font-black text-purple-700">Ready?</h2>
        <p class="text-gray-400 text-sm">Enter details to join the fun</p>

        <div class="space-y-3">
            <input id="nickname" placeholder="Nickname" 
                class="border-2 border-purple-50 p-3 w-full rounded-xl text-center outline-none focus:border-purple-300 transition">
            <input id="pinInput" placeholder="Lobby Code" 
                class="border-2 border-purple-50 p-3 w-full rounded-xl text-center font-mono text-lg outline-none focus:border-purple-300 transition">
        </div>

        <button onclick="joinGame()" 
            class="bg-purple-600 text-white w-full py-3 rounded-xl font-bold shadow-md hover:bg-purple-700 transition">
            Enter Lobby
        </button>

        <button onclick="location.reload()" class="text-sm text-gray-400 hover:text-purple-600 transition">
            ← Back
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
