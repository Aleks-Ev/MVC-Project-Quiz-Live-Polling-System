<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuizFlow</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  .fade-in {
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .pop {
    transform: scale(1.05);
    transition: 0.2s;
  }
</style>
</head>

<body class="bg-gradient-to-br from-purple-200 via-purple-100 to-purple-300 min-h-screen flex items-center justify-center font-sans">

<!-- 🔊 SOUNDS -->
<audio id="soundCorrect" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
<audio id="soundWrong" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

<!-- HOME -->
<div id="home" class="text-center space-y-6">
  <h1 class="text-5xl font-bold text-purple-800">QuizFlow</h1>

  <button onclick="showJoin()" class="bg-white text-purple-700 px-8 py-3 rounded-2xl shadow hover:scale-105 transition">
    Join Game
  </button>

  <button onclick="createGame()" class="bg-purple-500 text-white px-8 py-3 rounded-2xl shadow hover:scale-105 transition">
    Create Game
  </button>
</div>

<!-- JOIN -->
<div id="join" class="hidden bg-white p-8 rounded-3xl shadow-lg text-center space-y-4 w-80 fade-in">
  <h2 class="text-2xl font-bold text-purple-700">Enter Nickname</h2>

  <input id="nickname" type="text" placeholder="Your nickname"
    class="border p-3 rounded-xl w-full text-center"/>

  <button onclick="joinGame()" class="bg-purple-500 text-white px-5 py-2 rounded-xl w-full">
    Join
  </button>

  <button onclick="goHome()" class="text-sm text-purple-500 hover:underline">← Back</button>
</div>

<!-- LOBBY -->
<div id="lobby" class="hidden bg-white p-8 rounded-3xl shadow-lg w-96 text-center space-y-6 fade-in">
  <h2 class="text-2xl font-bold text-purple-700">Lobby</h2>

  <div>PIN: <span id="pin" class="font-bold text-purple-600"></span></div>

  <ul id="players" class="space-y-2"></ul>

  <button onclick="startGame()" class="bg-purple-500 text-white px-5 py-2 rounded-xl w-full">
    Start Game
  </button>
</div>

<!-- QUIZ -->
<div id="quiz" class="hidden w-full max-w-md text-center space-y-6 fade-in">

  <!-- TIMER -->
  <div class="w-full px-4">
    <div class="h-2 bg-white/50 rounded-full overflow-hidden">
      <div id="timerBar" class="h-full bg-purple-600 w-full transition-all"></div>
    </div>
  </div>

  <h2 id="question" class="text-xl font-bold text-purple-800"></h2>

  <div class="grid grid-cols-2 gap-4">
    <div onclick="answer(0)" class="bg-purple-300 h-24 rounded-2xl flex items-center justify-center cursor-pointer"></div>
    <div onclick="answer(1)" class="bg-purple-400 text-white h-24 rounded-2xl flex items-center justify-center cursor-pointer"></div>
    <div onclick="answer(2)" class="bg-purple-200 h-24 rounded-2xl flex items-center justify-center cursor-pointer"></div>
    <div onclick="answer(3)" class="bg-purple-500 text-white h-24 rounded-2xl flex items-center justify-center cursor-pointer"></div>
  </div>

</div>

<!-- LEADERBOARD -->
<div id="leaderboard" class="hidden w-full max-w-md text-center space-y-6 fade-in">

  <h2 class="text-3xl font-bold text-purple-800">🏆 Results</h2>

  <div id="top3" class="flex justify-center gap-3 items-end"></div>

  <div id="leaderboardList" class="space-y-2"></div>

  <button onclick="goHome()" 
    class="bg-purple-500 text-white px-5 py-2 rounded-xl w-full hover:bg-purple-600 transition">
    Play Again
  </button>
</div>

<script>
let players = [];
let scores = {};
let currentQuestion = 0;
let startTime = 0;
let timeLeft = 10;
let timerInterval;

const questions = [
  {
    q: "Capital of France?",
    answers: ["Berlin", "Paris", "Madrid", "Rome"],
    correct: 1
  },
  {
    q: "2 + 2 = ?",
    answers: ["3", "4", "5", "6"],
    correct: 1
  }
];

// 🔁 NAVIGATION
function hideAll() {
  ["home","join","lobby","quiz","leaderboard"].forEach(id =>
    document.getElementById(id).classList.add("hidden")
  );
}
function goHome() {
  hideAll();
  document.getElementById("home").classList.remove("hidden");
}

function showJoin() {
  hideAll();
  document.getElementById("join").classList.remove("hidden");
}

// 🎮 GAME START
function createGame() {
  const pin = Math.floor(100000 + Math.random() * 900000);
  document.getElementById("pin").innerText = pin;

  players = ["Host"];
  scores = { Host: 0 };

  updatePlayers();

  hideAll();
  document.getElementById("lobby").classList.remove("hidden");
}

function joinGame() {
  const nick = document.getElementById("nickname").value;
  if (!nick) return alert("Enter nickname");

  players.push(nick);
  scores[nick] = 0;

  updatePlayers();

  hideAll();
  document.getElementById("lobby").classList.remove("hidden");
}

function updatePlayers() {
  const list = document.getElementById("players");
  list.innerHTML = "";

  players.forEach(p => {
    const li = document.createElement("li");
    li.className = "bg-purple-100 p-2 rounded-xl flex justify-between";
    list.appendChild(li);
  });
}

// 🚀 START GAME
function startGame() {
  currentQuestion = 0;
  showQuestion();
  hideAll();
  document.getElementById("quiz").classList.remove("hidden");
}

// ❓ QUESTION
function showQuestion() {
  const q = questions[currentQuestion];
  document.getElementById("question").innerText = q.q;

  const answers = document.querySelectorAll("#quiz .grid div");

  answers.forEach((el, i) => {
    el.innerText = q.answers[i];
    el.classList.remove("ring-4","ring-green-500","ring-red-500","pop");
    el.classList.add("fade-in");
  });

  clearInterval(timerInterval);
  timeLeft = 10;

  const bar = document.getElementById("timerBar");
  bar.style.width = "100%";

  startTime = Date.now();

  timerInterval = setInterval(() => {
    timeLeft--;
    bar.style.width = (timeLeft / 10) * 100 + "%";

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      autoNext();
    }
  }, 1000);
}

// 🎯 ANSWER
function answer(index) {
  clearInterval(timerInterval);

  const q = questions[currentQuestion];
  const answers = document.querySelectorAll("#quiz .grid div");

  const correctSound = document.getElementById("soundCorrect");
  const wrongSound = document.getElementById("soundWrong");

  let player = players[players.length - 1];
  let timeTaken = (Date.now() - startTime) / 1000;

  answers[index].classList.add("pop");

  if (index === q.correct) {
    answers[index].classList.add("ring-4","ring-green-500");
    correctSound.play();

    let points = Math.max(1000 - timeTaken * 200, 100);
    scores[player] += Math.floor(points);

  } else {
    answers[index].classList.add("ring-4","ring-red-500");
    wrongSound.play();
  }

  setTimeout(autoNext, 900);
}

// ⏭️ NEXT
function autoNext() {
  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showLeaderboard();
  }
}

// 🏆 LEADERBOARD
function showLeaderboard() {
  hideAll();

  const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);

  const top3 = document.getElementById("top3");
  const list = document.getElementById("leaderboardList");

  top3.innerHTML = "";
  list.innerHTML = "";

  const medals = ["🥇","🥈","🥉"];

  sorted.forEach(([name, score], i) => {

    if (i < 3) {
      const card = document.createElement("div");
      card.className = "bg-white/80 p-3 rounded-2xl shadow-md w-20 fade-in";

      card.innerHTML = `
        <div class="text-xl">${medals[i]}</div>
        <div class="font-bold text-sm">${name}</div>
        <div class="text-xs">${score}</div>
      `;

      top3.appendChild(card);

    } else {
      const row = document.createElement("div");
      row.className = "bg-white/70 p-3 rounded-xl flex justify-between fade-in";

      row.innerHTML = `
        <span>${i+1}. ${name}</span>
        <span class="font-semibold">${score}</span>
      `;

      list.appendChild(row);
    }
  });

  document.getElementById("leaderboard").classList.remove("hidden");
}
</script>

</body>
</html>
